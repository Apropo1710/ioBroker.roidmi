name: Test and build adapter

on:
  push:
    branches:
      - main
      - feat/room-profile-read
      - feature/xiaomi-x20plus
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Read package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Package adapter for testing
        run: |
          mkdir -p artifact
          tar --exclude='.git' --exclude='node_modules' -czf "artifact/iobroker.roidmi-${{ steps.package.outputs.version }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: iobroker-roidmi-${{ steps.package.outputs.version }}
          path: artifact/iobroker.roidmi-${{ steps.package.outputs.version }}.tar.gz
          if-no-files-found: error
