name: Build distribution

on:
  push:
    branches: [main]
    paths-ignore:
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Commit precompiled JavaScript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/
          if ! git diff --cached --quiet; then
            git commit -m "Build precompiled adapter files"
            git push
          fi
